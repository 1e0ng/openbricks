# Codecov configuration — per-flag status checks.
#
# The default Codecov behaviour is to flag a project-wide drop in
# aggregate coverage as a failure. That misfires here because the
# openbricks-dev host CLI (Python, ~73% covered) and the C core
# (gcov, ~98% covered) are different codebases with different
# testability profiles — adding one would otherwise drag the
# aggregate number down and flip the check red for no real regression.
#
# Instead we compute status per-flag, with a small threshold to
# absorb rounding noise. A true regression in either surface still
# fails CI; an asymmetric addition in the other doesn't.

codecov:
  notify:
    # Six uploads reach Codecov per pull-request run (c-core twice,
    # openbricks-py, openbricks-dev, openbricks-sim, sim-rs). Without this
    # the patch status was posted after the first upload, while the Rust
    # diff still counted as uncovered, and not always posted again once
    # the last upload landed — #526 stayed at "72.60% of diff hit" in red
    # while Codecov's own compare of the finished head showed 99.6%.
    after_n_builds: 6
    wait_for_ci: true

coverage:
  status:
    project:
      default: false
      c-core:
        flags:
          - c-core
        target: auto
        threshold: 1%
      openbricks-py:
        flags:
          - openbricks-py
        target: auto
        threshold: 2%
      openbricks-dev:
        flags:
          - openbricks-dev
        target: auto
        threshold: 2%
      openbricks-sim:
        flags:
          - openbricks-sim
        target: auto
        threshold: 2%
      sim-rs:
        flags:
          - sim-rs
        target: auto
        threshold: 2%
    patch:
      default:
        # Patch coverage is the right gate — new code should be
        # tested. Keep it at auto (target = base-branch patch level)
        # so the threshold moves with the project.
        target: auto
        threshold: 1%

flags:
  c-core:
    paths:
      - native/user_c_modules/openbricks/
  openbricks-py:
    paths:
      - openbricks/
  openbricks-dev:
    paths:
      - tools/openbricks/openbricks_dev/
  openbricks-sim:
    paths:
      - tools/openbricks/openbricks_sim/
  sim-rs:
    paths:
      - tools/sim/src/
