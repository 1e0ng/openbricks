[package]
name = "openbricks-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytemuck = "1.25.2"
eframe = { version = "0.35.0", features = ["wgpu"] }
egui = "0.35.0"
flate2 = "1.1.10"
glam = "0.33.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
pollster = "0.4.0"

[profile.release]
opt-level = 3
debug = false
