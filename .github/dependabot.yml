# Dependabot version updates. Three real dependency surfaces:
#
#   * the CI/website workflow actions (.github/workflows/*.yaml),
#   * the docs toolchain pins (docs/requirements.txt),
#   * the host CLI package (tools/openbricks/pyproject.toml).
#
# Deliberately NOT covered: the native/micropython submodule. It is
# pinned on purpose — every bump requires re-checking the build-time
# patches in native/patches/ against the new tree, so submodule
# updates are a manual, reviewed step, never an automated PR.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Each ecosystem's updates arrive GROUPED as one PR. Ungrouped, the
  # first Dependabot run opened five separate PRs all editing
  # docs/requirements.txt — mutually conflicting, and each one failing
  # the offline-docs bundle source-hash check (the bundle must be
  # rebuilt whenever a tracked docs/ file changes, requirements.txt
  # included). One PR per ecosystem means one rebase and one bundle
  # rebuild per week at most.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-toolchain:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/tools/openbricks"
    schedule:
      interval: "weekly"
    groups:
      cli-deps:
        patterns: ["*"]
